<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1000" viewBox="0 0 2200 1000" font-family="Carlito, Calibri, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#21295C"/></marker>
  </defs>
  <rect width="2200" height="1000" fill="#FFFFFF"/>

  <!-- Steps -->
  <g>
    <circle cx="200" cy="330" r="130" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3"/>
    <text x="200" y="320" font-size="44" font-weight="700" fill="#21295C" text-anchor="middle">Client</text>
    <text x="200" y="368" font-size="28" fill="#334155" text-anchor="middle">demo.http</text>

    <line x1="340" y1="330" x2="520" y2="330" stroke="#21295C" stroke-width="6" marker-end="url(#a)"/>
    <text x="430" y="300" font-size="28" fill="#475569" text-anchor="middle">order</text>

    <circle cx="700" cy="330" r="170" fill="#21295C"/>
    <text x="700" y="310" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle">Coffee shop</text>
    <text x="700" y="358" font-size="30" fill="#7DD3FC" text-anchor="middle">Quarkus app</text>

    <line x1="880" y1="330" x2="1080" y2="330" stroke="#21295C" stroke-width="6" marker-end="url(#a)"/>
    <text x="980" y="300" font-size="28" fill="#475569" text-anchor="middle">brew · 3 s</text>

    <circle cx="1260" cy="330" r="170" fill="#065A82"/>
    <text x="1260" y="310" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">Coffee machine</text>
    <text x="1260" y="358" font-size="30" fill="#E0F2FE" text-anchor="middle">remote, WireMock</text>

    <path d="M760,165 C900,60 1650,60 1760,185" stroke="#21295C" stroke-width="6" fill="none" marker-end="url(#a)"/>
    <text x="1260" y="40" font-size="28" fill="#475569" text-anchor="middle">then save the order</text>

    <circle cx="1830" cy="330" r="150" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3"/>
    <text x="1830" y="320" font-size="44" font-weight="700" fill="#21295C" text-anchor="middle">PostgreSQL</text>
    <text x="1830" y="368" font-size="28" fill="#334155" text-anchor="middle">the order book</text>
  </g>

  <!-- Waiting bar -->
  <text x="100" y="640" font-size="34" font-weight="700" fill="#21295C">Where one request spends its time</text>
  <rect x="100" y="670" width="70" height="90" rx="8" fill="#21295C"/>
  <rect x="180" y="670" width="1780" height="90" rx="8" fill="#065A82"/>
  <rect x="1970" y="670" width="130" height="90" rx="8" fill="#94A3B8"/>
  <text x="1070" y="728" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">waiting for the coffee machine · 3 s</text>
  <text x="135" y="800" font-size="24" fill="#475569" text-anchor="middle">code</text>
  <text x="2035" y="800" font-size="24" fill="#475569" text-anchor="middle">save</text>
  <text x="100" y="880" font-size="34" fill="#334155">The thread does nothing for ~3 s. What happens to it while it waits is what the four approaches change.</text>
</svg>
