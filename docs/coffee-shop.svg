<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1000" viewBox="0 0 2200 1000" font-family="Carlito, Calibri, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#065A82"/>
    </marker>
  </defs>
  <rect width="2200" height="1000" fill="#FFFFFF"/>

  <!-- Client -->
  <rect x="20" y="300" width="330" height="200" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="20" y="300" width="12" height="200" rx="4" fill="#475569"/>
  <text x="60" y="365" font-size="40" font-weight="700" fill="#21295C">Client</text>
  <text x="60" y="415" font-size="28" fill="#334155">demo.http</text>
  <text x="60" y="455" font-size="28" fill="#334155">one request, or 100</text>

  <!-- Client -> app -->
  <line x1="352" y1="400" x2="470" y2="400" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="405" y="378" font-size="24" fill="#475569" text-anchor="middle">HTTP</text>

  <!-- The coffee shop app -->
  <rect x="480" y="40" width="900" height="720" rx="22" fill="#21295C"/>
  <text x="530" y="118" font-size="52" font-weight="700" fill="#FFFFFF">The Coffee Shop</text>
  <text x="530" y="168" font-size="30" fill="#7DD3FC">Quarkus 3.40 · JDK 27 · one app, four ways to serve</text>

  <!-- Lanes -->
  <g font-size="32">
    <rect x="530" y="210" width="800" height="110" rx="12" fill="#F1F5F9"/>
    <rect x="530" y="210" width="12" height="110" rx="4" fill="#475569"/>
    <text x="570" y="258" font-weight="700" fill="#21295C">01 · Blocking</text>
    <text x="570" y="298" font-size="27" fill="#334155">platform threads from a worker pool</text>
    <text x="1300" y="258" font-size="24" fill="#64748B" text-anchor="end">/beverage/blocking</text>

    <rect x="530" y="340" width="800" height="110" rx="12" fill="#F1F5F9"/>
    <rect x="530" y="340" width="12" height="110" rx="4" fill="#065A82"/>
    <text x="570" y="388" font-weight="700" fill="#21295C">02 · Reactive</text>
    <text x="570" y="428" font-size="27" fill="#334155">Mutiny on the Vert.x event loop</text>
    <text x="1300" y="388" font-size="24" fill="#64748B" text-anchor="end">/beverage/reactive</text>

    <rect x="530" y="470" width="800" height="110" rx="12" fill="#F1F5F9"/>
    <rect x="530" y="470" width="12" height="110" rx="4" fill="#047857"/>
    <text x="570" y="518" font-weight="700" fill="#21295C">03 · Virtual threads</text>
    <text x="570" y="558" font-size="27" fill="#334155">same blocking code, @RunOnVirtualThread</text>
    <text x="1300" y="518" font-size="24" fill="#64748B" text-anchor="end">/beverage/virtual</text>

    <rect x="530" y="600" width="800" height="110" rx="12" fill="#F1F5F9"/>
    <rect x="530" y="600" width="12" height="110" rx="4" fill="#E11D48"/>
    <text x="570" y="648" font-weight="700" fill="#21295C">04 · Structured concurrency</text>
    <text x="570" y="688" font-size="27" fill="#334155">StructuredTaskScope: race, fail-fast</text>
    <text x="1300" y="648" font-size="24" fill="#64748B" text-anchor="end">/beverage/structured</text>
  </g>

  <!-- App -> coffee machine -->
  <path d="M1382,250 L1640,250" stroke="#065A82" stroke-width="5" fill="none" marker-end="url(#arrowTeal)"/>
  <text x="1505" y="230" font-size="24" fill="#065A82" text-anchor="middle">REST client</text>

  <!-- Coffee machine -->
  <rect x="1650" y="90" width="530" height="290" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="1650" y="90" width="12" height="290" rx="4" fill="#065A82"/>
  <text x="1690" y="160" font-size="40" font-weight="700" fill="#21295C">Coffee machine</text>
  <text x="1690" y="205" font-size="28" fill="#334155">WireMock, the slow I/O call</text>
  <text x="1690" y="275" font-size="48" font-weight="700" fill="#065A82">3 s</text>
  <text x="1770" y="275" font-size="28" fill="#334155">per brew</text>
  <text x="1690" y="330" font-size="26" fill="#64748B">random 1–3 s for the races</text>

  <!-- App -> PostgreSQL -->
  <path d="M1382,560 L1640,560" stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="1505" y="540" font-size="24" fill="#475569" text-anchor="middle">persist</text>

  <!-- PostgreSQL -->
  <rect x="1650" y="440" width="530" height="240" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="1650" y="440" width="12" height="240" rx="4" fill="#475569"/>
  <text x="1690" y="510" font-size="40" font-weight="700" fill="#21295C">PostgreSQL</text>
  <text x="1690" y="560" font-size="28" fill="#334155">Hibernate ORM (blocking, virtual)</text>
  <text x="1690" y="600" font-size="28" fill="#334155">Hibernate Reactive (reactive)</text>

  <!-- Observability -->
  <path d="M930,762 L930,830" stroke="#64748B" stroke-width="4" stroke-dasharray="12 9" fill="none" marker-end="url(#arrow)"/>
  <text x="960" y="808" font-size="24" fill="#64748B">metrics, traces, logs · OpenTelemetry</text>
  <rect x="480" y="840" width="900" height="140" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="480" y="840" width="12" height="140" rx="4" fill="#64748B"/>
  <text x="520" y="900" font-size="36" font-weight="700" fill="#21295C">Grafana (LGTM)</text>
  <text x="520" y="945" font-size="27" fill="#334155">“Concurrency Crossroads” dashboard: platform vs virtual threads</text>

  <!-- Dev Services note -->
  <text x="2180" y="960" font-size="26" fill="#64748B" text-anchor="end" font-style="italic">Coffee machine, PostgreSQL and Grafana</text>
  <text x="2180" y="992" font-size="26" fill="#64748B" text-anchor="end" font-style="italic">all start with Quarkus Dev Services</text>
</svg>
