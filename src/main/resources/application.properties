quarkus.http.access-log.enabled=true
quarkus.http.access-log.exclude-pattern=/q/.*
# Cap the worker pool so blocking saturates visibly in the flood demo
%dev.quarkus.thread-pool.max-threads=50
%dev.quarkus.thread-pool.queue-size=25
# Don't let the REST client connection pool cap the flood demos
%dev.quarkus.rest-client.coffee-machine.connection-pool-size=1000

# Suppress verbose WireMock request/response logging
quarkus.log.category."io.quarkiverse.wiremock.devservice.WireMockServer".level=WARN

# Coffee machine — standalone WireMock container in dev (3s delay), WireMock DevService in test (100ms)
%dev.quarkus.compose.devservices.files=src/main/docker/compose-dev.yml
%dev.quarkus.wiremock.devservices.enabled=false
%dev.quarkus.rest-client.coffee-machine.url=http://localhost:${coffee-machine.port}
%test.quarkus.wiremock.devservices.files-mapping=src/test/resources/wiremock
%test.quarkus.rest-client.coffee-machine.url=http://localhost:${quarkus.wiremock.devservices.port}
